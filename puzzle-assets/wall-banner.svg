<circle cx="180" cy="590" r="32" fill="url(#recessGlow)"/><circle cx="180" cy="590" r="26" fill="#0c1618" stroke="#4a6b68" stroke-width="2"/><circle cx="180" cy="590" r="26" fill="none" stroke="#8fd8c9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3 3.5"/><circle cx="290" cy="590" r="32" fill="url(#recessGlow)"/><circle cx="290" cy="590" r="26" fill="#0c1618" stroke="#4a6b68" stroke-width="2"/><circle cx="290" cy="590" r="26" fill="none" stroke="#8fd8c9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3 3.5"/><circle cx="400" cy="590" r="32" fill="url(#recessGlow)"/><circle cx="400" cy="590" r="26" fill="#0c1618" stroke="#4a6b68" stroke-width="2"/><circle cx="400" cy="590" r="26" fill="none" stroke="#8fd8c9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3 3.5"/><circle cx="510" cy="590" r="32" fill="url(#recessGlow)"/><circle cx="510" cy="590" r="26" fill="#0c1618" stroke="#4a6b68" stroke-width="2"/><circle cx="510" cy="590" r="26" fill="none" stroke="#8fd8c9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3 3.5"/><circle cx="620" cy="590" r="32" fill="url(#recessGlow)"/><circle cx="620" cy="590" r="26" fill="#0c1618" stroke="#4a6b68" stroke-width="2"/><circle cx="620" cy="590" r="26" fill="none" stroke="#8fd8c9" stroke-width="0.7" opacity="0.3" stroke-dasharray="3 3.5"/></g>

