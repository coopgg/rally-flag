<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
    <stop offset="0%" stop-color="#0f2117"/>
    <stop offset="55%" stop-color="#08140e"/>
    <stop offset="100%" stop-color="#040a07"/>
  </radialGradient>
  <linearGradient id="hexFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#123522"/>
    <stop offset="100%" stop-color="#0a1f15"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7fd8a8"/>
  </marker>
  <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- background -->
<rect width="1600" height="900" fill="url(#bgGlow)"/>
<g opacity="0.10" stroke="#7fd8a8" stroke-width="1" fill="none">
  <circle cx="180" cy="740" r="150"/>
  <circle cx="180" cy="740" r="110"/>
  <circle cx="1440" cy="180" r="170"/>
  <circle cx="1440" cy="180" r="125"/>
  <g stroke-width="0.7">
    <line x1="30" y1="740" x2="330" y2="740"/>
    <line x1="180" y1="590" x2="180" y2="890"/>
    <line x1="70" y1="630" x2="290" y2="850"/>
    <line x1="70" y1="850" x2="290" y2="630"/>
    <line x1="1270" y1="180" x2="1610" y2="180"/>
    <line x1="1440" y1="10" x2="1440" y2="350"/>
  </g>
</g>

<!-- header -->
<g transform="translate(64,50)">
  <polygon points="0,0 22,34 0,68 -22,34" fill="none" stroke="#7fd8a8" stroke-width="2"/>
  <polygon points="0,14 12,34 0,54 -12,34" fill="#7fd8a8" opacity="0.5"/>
</g>
<text x="112" y="60" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="34" fill="#f2fdf6" letter-spacing="1">OVERSOUL BRIDGE</text>
<text x="112" y="88" font-family="Inter, sans-serif" font-size="15" fill="#9fc9ae">Crota's End &#183; Oversoul Throne Bridge Crossing Order</text>

<text x="1536" y="60" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="18" fill="#7fd8a8" text-anchor="end" letter-spacing="2">RALLY FLAG</text>
<text x="1536" y="80" font-family="JetBrains Mono, monospace" font-size="11" fill="#5f8a71" text-anchor="end" letter-spacing="1">COMMUNITY GUIDE</text>

<line x1="60" y1="112" x2="1540" y2="112" stroke="#7fd8a8" stroke-opacity="0.25"/>

<!-- progression legend key (top-left, matches "-> is chalice progression") -->
<g transform="translate(64,140)">
  <line x1="0" y1="0" x2="34" y2="0" stroke="#7fd8a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="46" y="5" font-family="JetBrains Mono, monospace" font-size="13" fill="#bcdfc9">is chalice progression</text>
</g>

<!-- SWORD DUNKERS bracket + label -->
<g>
  <path d="M 555 210 L 555 175 L 1235 175 L 1235 210" fill="none" stroke="#7fd8a8" stroke-width="1.5" opacity="0.8"/>
  <rect x="700" y="115" width="290" height="60" rx="4" fill="url(#hexFill)" stroke="#7fd8a8" stroke-width="1.5"/>
  <text x="845" y="152" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="21" fill="#f2fdf6" text-anchor="middle" letter-spacing="1">SWORD DUNKERS</text>
</g>

<!-- chalice row: 1 2 3 4 5 6 1 -->
<!-- x positions: 320 465 610 755 900 1045 1190, y=260, size 90 -->
<g font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="34" text-anchor="middle">
  <!-- box template macro repeated manually -->
  <g filter="url(#softGlow)">
    <rect x="320" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#5fc9e8" stroke-width="2.5"/>
    <text x="365" y="317" fill="#bdeeff">1</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="465" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#b98ef2" stroke-width="2.5"/>
    <text x="510" y="317" fill="#e6d3ff">2</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="610" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#66e29a" stroke-width="2.5"/>
    <text x="655" y="317" fill="#c8ffde">3</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="755" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#f27a8a" stroke-width="2.5"/>
    <text x="800" y="317" fill="#ffd4da">4</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="900" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#f2c96a" stroke-width="2.5"/>
    <text x="945" y="317" fill="#ffedc2">5</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="1045" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#f26fc9" stroke-width="2.5"/>
    <text x="1090" y="317" fill="#ffd3f0">6</text>
  </g>
  <g filter="url(#softGlow)">
    <rect x="1190" y="260" width="90" height="90" rx="6" fill="url(#hexFill)" stroke="#5fc9e8" stroke-width="2.5"/>
    <text x="1235" y="317" fill="#bdeeff">1</text>
  </g>
</g>

<!-- arrows connecting the row -->
<g stroke="#7fd8a8" stroke-width="2.5" marker-end="url(#arrow)">
  <line x1="410" y1="305" x2="460" y2="305"/>
  <line x1="555" y1="305" x2="605" y2="305"/>
  <line x1="700" y1="305" x2="750" y2="305"/>
  <line x1="845" y1="305" x2="895" y2="305"/>
  <line x1="990" y1="305" x2="1040" y2="305"/>
  <line x1="1135" y1="305" x2="1185" y2="305"/>
</g>

<!-- box1 -> down -> right into "dunk enlightened" callout -->
<path d="M 365 350 L 365 500 L 480 500" fill="none" stroke="#7fd8a8" stroke-width="2.5" marker-end="url(#arrow)"/>
<!-- box2 -> straight down into same callout -->
<line x1="510" y1="350" x2="510" y2="560" stroke="#7fd8a8" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="360" y="580" width="360" height="72" rx="6" fill="url(#hexFill)" stroke="#7fd8a8" stroke-width="1.5"/>
<text x="540" y="609" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="17" fill="#f2fdf6" text-anchor="middle">DUNK ENLIGHTENED</text>
<text x="540" y="632" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="17" fill="#f2fdf6" text-anchor="middle">ON BRIDGE</text>

<!-- bracket over 5,6 -> down to "4 helps hold plates" -->
<path d="M 945 350 L 945 385 L 1090 385 L 1090 350" fill="none" stroke="#7fd8a8" stroke-width="1.5" opacity="0.85"/>
<line x1="1017" y1="385" x2="1017" y2="560" stroke="#7fd8a8" stroke-width="2.5" marker-end="url(#arrow)"/>

<g transform="translate(840,580)">
  <rect width="360" height="72" rx="6" fill="url(#hexFill)" stroke="#7fd8a8" stroke-width="1.5"/>
  <rect x="18" y="20" width="32" height="32" rx="4" fill="url(#hexFill)" stroke="#f27a8a" stroke-width="2"/>
  <text x="34" y="43" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="17" fill="#ffd4da" text-anchor="middle">4</text>
  <text x="66" y="30" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="16" fill="#f2fdf6">HELPS HOLD PLATES</text>
  <text x="66" y="52" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="16" fill="#f2fdf6">DURING SWAP</text>
</g>

<!-- final box1 -> right -> "2 crosses and dunks chalice" -->
<line x1="1280" y1="305" x2="1340" y2="305" stroke="#7fd8a8" stroke-width="2.5" marker-end="url(#arrow)"/>
<g transform="translate(1352,260)">
  <rect width="200" height="90" rx="6" fill="url(#hexFill)" stroke="#7fd8a8" stroke-width="1.5"/>
  <rect x="18" y="29" width="32" height="32" rx="4" fill="url(#hexFill)" stroke="#b98ef2" stroke-width="2"/>
  <text x="34" y="52" font-family="Oswald, Arial Narrow, sans-serif" font-weight="700" font-size="17" fill="#e6d3ff" text-anchor="middle">2</text>
  <text x="66" y="40" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="15" fill="#f2fdf6">CROSSES AND</text>
  <text x="66" y="60" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="15" fill="#f2fdf6">DUNKS CHALICE</text>
</g>

<line x1="60" y1="720" x2="1540" y2="720" stroke="#7fd8a8" stroke-opacity="0.25"/>

<!-- bottom legend groups -->
<g transform="translate(64,752)">
  <g>
    <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#5fc9e8" stroke-width="2"/>
    <text x="15" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#bdeeff" text-anchor="middle">1</text>
    <rect x="38" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#f2c96a" stroke-width="2"/>
    <text x="53" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#ffedc2" text-anchor="middle">5</text>
    <rect x="76" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#f26fc9" stroke-width="2"/>
    <text x="91" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#ffd3f0" text-anchor="middle">6</text>
  </g>
  <text x="122" y="14" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="16" fill="#f2fdf6">ARE HOLDING PLATES ON FIRST SIDE</text>
</g>

<g transform="translate(64,802)">
  <g>
    <rect x="0" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#b98ef2" stroke-width="2"/>
    <text x="15" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#e6d3ff" text-anchor="middle">2</text>
    <rect x="38" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#66e29a" stroke-width="2"/>
    <text x="53" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#c8ffde" text-anchor="middle">3</text>
    <rect x="76" y="0" width="30" height="30" rx="4" fill="url(#hexFill)" stroke="#f27a8a" stroke-width="2"/>
    <text x="91" y="21" font-family="Oswald, sans-serif" font-weight="700" font-size="15" fill="#ffd4da" text-anchor="middle">4</text>
  </g>
  <text x="122" y="14" font-family="Oswald, Arial Narrow, sans-serif" font-weight="600" font-size="16" fill="#f2fdf6">ON PLATES ON OTHER SIDE ASAP</text>
  <text x="122" y="34" font-family="Inter, sans-serif" font-size="12.5" fill="#9fc9ae">(need to swap enlightened amongst themselves to get the bridge building)</text>
</g>

</svg>
